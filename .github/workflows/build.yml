name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch and compress recitation audio
        run: |
          if curl -fL --retry 3 --retry-delay 3 -A "Mozilla/5.0" -o /tmp/raw.mp3 "https://archive.org/download/manzil-dua-audio/manzil-dua-audio.mp3"; then
            ls -la /tmp/raw.mp3
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            ffmpeg -nostdin -y -i /tmp/raw.mp3 -vn -ac 1 -ar 24000 -b:a 48k audio.mp3
            ls -la audio.mp3
          else
            echo "Audio download failed - the audio.mp3 will be missing from this release"
          fi
      - name: Build release APK
        run: gradle assembleRelease --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Manzil.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Manzil build ${{ github.run_number }}
          files: |
            Manzil.apk
            audio.mp3
